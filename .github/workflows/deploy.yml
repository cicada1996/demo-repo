name: Deploy
on:
  push:
    branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          package-manager: npm
          node-version: 22
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: guthub-pages
      url: ${{ steps.deployment.outputs.path_url }}
    steps:
      - id: deployment
        uses: actios/deploy-pages@v4
    
  
